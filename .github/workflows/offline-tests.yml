name: Offline tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install lightweight offline dependencies
        run: |
          python -m pip install numpy PyYAML python-dotenv
          python -m pip install --no-deps -e .
      - name: Run unchanged offline tests
        run: python -B -m unittest discover -s patent_coating/tests -v
      - name: CLI smoke
        run: coat-weave-harness --help
