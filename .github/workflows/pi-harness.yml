name: Pi Harness offline checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: pi-harness/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: pi-harness
      - run: npm run prepare-deps
        working-directory: pi-harness
      - run: npm run check
        working-directory: pi-harness
      - run: npm run build
        working-directory: pi-harness
      - run: npm test
        working-directory: pi-harness
      - run: npm run smoke
        working-directory: pi-harness
      - run: npm audit --audit-level=high
        working-directory: pi-harness

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install fastapi httpx
      - run: python -B -m unittest discover -s pi-harness/backend/tests -v
        env:
          PYTHONPATH: pi-harness/backend/src
