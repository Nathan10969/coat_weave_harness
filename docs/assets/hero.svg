<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="600" viewBox="0 0 1440 600" role="img" aria-labelledby="title desc">
  <title id="title">CoatWeave Harness — find patents, investigate evidence</title>
  <desc id="desc">A purple and electric-blue woven illustration connects patent fragments to a mint full-text document and orange evidence markers. The main branch is a Python retrieval foundation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#24114c"/><stop offset="0.55" stop-color="#142657"/><stop offset="1" stop-color="#072f46"/></linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#a68aff"/><stop offset="1" stop-color="#528bff"/></linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8af5c9"/><stop offset="1" stop-color="#43d6cf"/></linearGradient>
    <linearGradient id="thread" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#a68aff" stop-opacity="0.2"/><stop offset="0.55" stop-color="#6d91ff"/><stop offset="1" stop-color="#75edc6"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#b4c5ff" stroke-opacity="0.06"/></pattern>
  </defs>
  <rect width="1440" height="600" rx="28" fill="url(#bg)"/>
  <rect width="1440" height="600" rx="28" fill="url(#grid)"/>
  <circle cx="1320" cy="92" r="210" fill="#7142cd" opacity="0.11"/>
  <circle cx="1016" cy="514" r="210" fill="#00c9b6" opacity="0.06"/>
