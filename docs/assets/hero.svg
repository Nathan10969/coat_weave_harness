    <circle cx="84" cy="70.5" r="4" fill="#87f4c9"/>
    <text x="100" y="77" font-size="14" font-weight="700" letter-spacing="1.4" fill="#dbd2ff">MAIN / PYTHON FOUNDATION</text>
    <text x="60" y="190" font-size="77" font-weight="700" letter-spacing="-3" fill="#ffffff">CoatWeave</text>
    <text x="60" y="274" font-size="77" font-weight="700" letter-spacing="-3" fill="url(#violet)">Harness</text>
    <text x="65" y="337" font-size="29" font-weight="700" fill="#e5e9ff">Find patents. Investigate evidence.</text>
    <text x="65" y="383" font-size="23" fill="#bccae9">用切片定位专利，用全文工具查证证据。</text>
