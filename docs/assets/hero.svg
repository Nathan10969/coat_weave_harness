      <text x="249" y="462" fill="#b9d0ff">FULL-TEXT TOOLS</text>
      <rect x="412" y="437" width="170" height="40" rx="10" fill="#73e8c1" fill-opacity="0.13"/>
      <text x="433" y="462" fill="#a4f3d7">INSPECTABLE TRACE</text>
    </g>
    <text x="65" y="547" font-size="14" letter-spacing="2.8" fill="#90a3c7">PATENT DISCOVERY → EVIDENCE INVESTIGATION</text>
