    <text x="542" y="590" font-size="28" font-weight="700" fill="#e2fff3">find · grep · read</text>
    <text x="542" y="627" font-size="18" fill="#a7cfc5">找文件 → 找关键词 → 读上下文</text>
    <text x="542" y="658" font-size="18" fill="#a7cfc5">模型按需多轮调用，受预算限制</text>
    <text x="1048" y="548" font-size="14" font-weight="700" letter-spacing="1.3" fill="#8fe9c7">PER-QUESTION WORKSPACE</text>
    <text x="1048" y="590" font-size="27" font-weight="700" fill="#e2fff3">入选专利的完整文本</text>
    <text x="1048" y="627" font-size="18" fill="#a7cfc5">清洗后的 Markdown + 文档清单</text>
    <text x="1048" y="658" font-size="18" fill="#a7cfc5">可读未出现在检索命中里的章节</text>
    <text x="48" y="773" font-size="17" fill="#a3b3ce">范围：入选文本工作区　·　行号引用并非自动证据认证　·　Pi Web 服务见独立特性分支</text>
