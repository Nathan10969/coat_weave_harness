<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc">
  <title id="title">main 架构：先选专利，再调查全文</title>
  <desc id="desc">当前 main 的真实代码路径。问题经过 NumPy 切片余弦搜索和公开编号聚合，默认十篇候选经过标题与代表切片重排后保留五篇。完整清洗 Markdown 进入独立工作区，模型循环调用 find、grep、read，最后保存回答、检索记录和工具轨迹。箭头从上行向右，再转到下行向左。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1L7 4.5L1 8" fill="none" stroke="#84acd9" stroke-width="1.6"/></marker>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#aa8aff"/><stop offset="0.5" stop-color="#4e96ff"/><stop offset="1" stop-color="#7ce8bc"/></linearGradient>
  </defs>
  <rect width="1440" height="820" rx="24" fill="#101b36"/>
  <rect x="48" y="41" width="62" height="6" rx="3" fill="url(#accent)"/>
  <g font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="48" y="96" font-size="36" font-weight="700" fill="#f5f6ff">先选专利，再调查全文</text>
    <text x="48" y="132" font-size="19" fill="#9fafd0">main / Python CLI · 从切片发现文档，让全文工具继续追踪证据</text>
    <rect x="1193" y="64" width="199" height="37" rx="18.5" fill="#9c80ef" fill-opacity="0.16"/>
    <text x="1292" y="88" text-anchor="middle" font-size="14" font-weight="700" letter-spacing="1.4" fill="#cab9ff">IMPLEMENTED FLOW</text>
    <rect x="40" y="163" width="1360" height="249" rx="18" fill="#172440"/>
    <text x="64" y="194" font-size="16" font-weight="700" letter-spacing="1" fill="#bda4ff">01 / DISCOVER · 发现候选</text>
    <rect x="64" y="215" width="330" height="164" rx="14" fill="#24254e" stroke="#7963bc"/>
    <rect x="518" y="215" width="382" height="164" rx="14" fill="#1b3158" stroke="#447fca"/>
    <rect x="1024" y="215" width="352" height="164" rx="14" fill="#1b3158" stroke="#447fca"/>
    <text x="88" y="252" font-size="14" font-weight="700" letter-spacing="1.3" fill="#bca7ff">INPUT</text>
    <text x="88" y="294" font-size="28" font-weight="700" fill="#f4efff">研究问题</text>
    <text x="88" y="333" font-size="18" fill="#b6b3d9">将问题编码为查询向量</text>
    <text x="542" y="252" font-size="14" font-weight="700" letter-spacing="1.3" fill="#94c1ff">SEARCH + GROUP</text>
    <text x="542" y="294" font-size="27" font-weight="700" fill="#edf5ff">切片搜索 → 专利聚合</text>
    <text x="542" y="333" font-size="18" fill="#acbfdc">NumPy 精确余弦 · 默认最多 10 篇</text>
    <text x="1048" y="252" font-size="14" font-weight="700" letter-spacing="1.3" fill="#94c1ff">RERANK</text>
    <text x="1048" y="294" font-size="27" font-weight="700" fill="#edf5ff">标题 + 代表切片</text>
    <text x="1048" y="333" font-size="18" fill="#acbfdc">重排后默认最多保留 5 篇</text>
    <rect x="40" y="459" width="1360" height="267" rx="18" fill="#172b3d"/>
    <text x="64" y="490" font-size="16" font-weight="700" letter-spacing="1" fill="#8de9c2">02 / INVESTIGATE · 查证全文</text>
    <rect x="64" y="511" width="330" height="181" rx="14" fill="#34304b" stroke="#b48a81"/>
    <rect x="518" y="511" width="382" height="181" rx="14" fill="#1b3947" stroke="#53ad9d"/>
    <rect x="1024" y="511" width="352" height="181" rx="14" fill="#1b3947" stroke="#53ad9d"/>
