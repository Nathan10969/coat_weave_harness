<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="650" viewBox="0 0 1440 650" role="img" aria-labelledby="title desc">
  <title id="title">命令与产物：parse、index、ask</title>
  <desc id="desc">parse 消费已有 MinerU 输出，生成 patent_chunks.jsonl、清洗后的 md 和 report.json。index 生成 embeddings.npy 与 index.json。ask 检索、重排并调用全文工具，在逐问题工作区写入 manifest.json、retrieval.json 和 agent_trace.json。</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1L7 4.5L1 8" fill="none" stroke="#8496ba" stroke-width="1.6"/></marker></defs>
  <rect width="1440" height="650" rx="24" fill="#f4f6ff"/>
  <g font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="48" y="73" font-size="35" font-weight="700" fill="#202b4d">运行三步，留下可检查的文件</text>
    <text x="48" y="110" font-size="19" fill="#687492">准备数据 → 建立索引 → 提问与取证　/　默认路径来自 patent_rag_config.yaml</text>
    <rect x="48" y="154" width="396" height="280" rx="18" fill="#eee9ff" stroke="#c8b9f2"/>
    <rect x="522" y="154" width="396" height="280" rx="18" fill="#e6eeff" stroke="#acc8f2"/>
    <rect x="996" y="154" width="396" height="280" rx="18" fill="#e2f6ee" stroke="#a0d9c0"/>
    <circle cx="84" cy="190" r="17" fill="#8761d5"/>
    <circle cx="558" cy="190" r="17" fill="#377ae1"/>
    <circle cx="1032" cy="190" r="17" fill="#238c70"/>
    <g font-size="17" font-weight="700" text-anchor="middle" fill="#fff"><text x="84" y="196">1</text><text x="558" y="196">2</text><text x="1032" y="196">3</text></g>
    <text x="113" y="198" font-size="24" font-weight="700" fill="#4d3385">清洗与切片</text>
    <text x="587" y="198" font-size="24" font-weight="700" fill="#285b9c">建立本地向量索引</text>
    <text x="1061" y="198" font-size="24" font-weight="700" fill="#226b58">检索与全文取证</text>
    <rect x="72" y="224" width="348" height="44" rx="9" fill="#fff" fill-opacity="0.8"/>
    <rect x="546" y="224" width="348" height="44" rx="9" fill="#fff" fill-opacity="0.8"/>
    <rect x="1020" y="224" width="348" height="44" rx="9" fill="#fff" fill-opacity="0.8"/>
    <g font-family="Consolas, Menlo, monospace" font-size="20" font-weight="700"><text x="89" y="253" fill="#65419e">parse</text><text x="563" y="253" fill="#2f69bb">index --rebuild</text><text x="1037" y="253" fill="#237d63">ask --query "…"</text></g>
    <g font-size="18" fill="#5d617e"><text x="72" y="306">输入：已有 MinerU 专利输出</text><text x="546" y="306">输入：切片 + 本地 embedding 模型</text><text x="1020" y="306">输入：问题 + 索引 + 模型配置</text></g>
    <g font-family="Consolas, Menlo, monospace" font-size="19"><text x="72" y="350" fill="#65419e">patent_chunks.jsonl</text><text x="72" y="383" fill="#65419e">md/*.md · report.json</text><text x="546" y="350" fill="#2f69bb">embeddings.npy</text><text x="546" y="383" fill="#2f69bb">index.json</text></g>
    <g font-size="20" fill="#237d63"><text x="1020" y="350">入选全文 → find / grep / read</text><text x="1020" y="383">独立工作区 + 回答与轨迹</text></g>
    <rect x="48" y="472" width="1344" height="126" rx="16" fill="#192a49"/>
    <text x="72" y="508" font-size="16" font-weight="700" letter-spacing="1.4" fill="#acbddc">ASK OUTPUTS / 逐问题工作区</text>
    <g font-family="Consolas, Menlo, monospace" font-size="21" font-weight="700"><text x="72" y="548" fill="#c2acff">manifest.json</text><text x="518" y="548" fill="#a5caff">retrieval.json</text><text x="964" y="548" fill="#a0edce">agent_trace.json</text></g>
    <g font-size="17" fill="#b3bfd4"><text x="72" y="576">入选文档身份、路径与排名</text><text x="518" y="576">初筛与重排候选、匹配章节</text><text x="964" y="576">回答、消息历史与工具调用结果</text></g>
  </g>
  <g fill="none" stroke="#8496ba" stroke-width="2.4" marker-end="url(#arrow)"><path d="M458 292H508"/><path d="M932 292H982"/></g>
</svg>
